<!-- Floating Chat Widget -->
<div id="chatbot-widget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
    
    <!-- Chat Window (Hidden by default) -->
    <div id="chat-window" class="hidden w-80 sm:w-96 bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-gray-100 transition-all duration-300 transform scale-95 opacity-0 origin-bottom-right mb-4" style="height: 500px; max-height: 80vh;">
        
        <!-- Header -->
        <div class="bg-blue-600 px-4 py-3 text-white flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h3 class="font-bold text-sm leading-tight">ERP Assistant</h3>
                    <p class="text-blue-200 text-[10px]">Powered by Groq</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Speaker Toggle -->
                <button type="button" id="speaker-toggle-btn" class="text-blue-200 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-white/10 flex items-center justify-center cursor-pointer" title="Toggle Read Aloud">
                    <!-- Speaker Muted (Default) -->
                    <svg id="speaker-muted-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 9H1.5v6h3l4.5 3.75V5.25z" />
                    </svg>
                    <!-- Speaker On -->
                    <svg id="speaker-on-icon" class="w-4 h-4 hidden text-emerald-350" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                    </svg>
                </button>
                
                <!-- Language Selector -->
                <select id="chat-language-select" class="bg-blue-700 border border-blue-500/50 text-[10px] font-black rounded-lg px-1.5 py-1 text-white focus:outline-none focus:ring-1 focus:ring-blue-400 cursor-pointer">
                    <option value="English" selected>EN</option>
                    <option value="Hinglish">HINGLISH</option>
                    <option value="Hindi">HI (हिंदी)</option>
                    <option value="Tamil">TA (தமிழ்)</option>
                    <option value="Marathi">MR (मराठी)</option>
                    <option value="Gujarati">GU (ગુજરાતી)</option>
                    <option value="Bengali">BN (বাংলা)</option>
                </select>
                
                <button id="close-chat-btn" class="text-blue-200 hover:text-white transition-colors p-0.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>
        
        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-3 space-y-2">
            <!-- Initial Greeting -->
            <div class="flex justify-start">
                <div class="bg-white border border-gray-100 text-gray-800 text-sm py-2 px-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                    Hello! I'm your ERP assistant powered by Groq. How can I help you with accounting, GST, or invoices today?
                </div>
            </div>
            
            <!-- Quick Suggestions -->
            <div class="flex flex-wrap gap-2 mt-2" id="chat-suggestions">
                <button type="button" class="suggestion-chip bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100 transition-colors">My total sales?</button>
                <button type="button" class="suggestion-chip bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100 transition-colors">Show recent invoices</button>
                <button type="button" class="suggestion-chip bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100 transition-colors">What is my profit?</button>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-gray-100">
            <form id="chat-form" class="flex items-center gap-2 relative">
                <div class="flex-1 relative flex items-center">
                    <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" class="w-full bg-gray-50 border border-gray-200 text-sm rounded-full py-2.5 pl-4 pr-20 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                    
                    <!-- Mic Button -->
                    <button type="button" id="mic-btn" class="absolute right-11 w-7 h-7 rounded-full text-gray-400 hover:text-blue-600 hover:bg-gray-100 flex items-center justify-center transition-colors cursor-pointer" title="Voice Search (Click to Speak)">
                        <!-- Mic Off Icon -->
                        <svg id="mic-off-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
                        </svg>
                        <!-- Mic Recording Icon -->
                        <span id="mic-recording-icon" class="hidden relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                    </button>
                    
                    <!-- Send Button -->
                    <button type="submit" id="send-btn" class="absolute right-2 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Floating Button -->
    <button id="chat-toggle-btn" class="w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg hover:shadow-xl hover:bg-blue-700 transition-all flex items-center justify-center hover:-translate-y-1">
        <svg id="chat-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <svg id="chat-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatToggleBtn = document.getElementById('chat-toggle-btn');
    const closeChatBtn = document.getElementById('close-chat-btn');
    const chatWindow = document.getElementById('chat-window');
    const iconOpen = document.getElementById('chat-icon-open');
    const iconClose = document.getElementById('chat-icon-close');
    
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    const sendBtn = document.getElementById('send-btn');

    // Multi-Language, Speech-to-Text, and Text-to-Speech Settings
    const chatLanguageSelect = document.getElementById('chat-language-select');
    const speakerToggleBtn = document.getElementById('speaker-toggle-btn');
    const speakerMutedIcon = document.getElementById('speaker-muted-icon');
    const speakerOnIcon = document.getElementById('speaker-on-icon');
    const micBtn = document.getElementById('mic-btn');
    const micOffIcon = document.getElementById('mic-off-icon');
    const micRecordingIcon = document.getElementById('mic-recording-icon');

    let isSpeakerEnabled = false;
    let isListening = false;
    let recognition = null;

    const languageConfig = {
        'English': { recog: 'en-IN', synth: 'en' },
        'Hinglish': { recog: 'hi-IN', synth: 'hi' }, // Speaks and recognizes Hinglish perfectly with Hindi parameters
        'Hindi': { recog: 'hi-IN', synth: 'hi' },
        'Tamil': { recog: 'ta-IN', synth: 'ta' },
        'Marathi': { recog: 'mr-IN', synth: 'mr' },
        'Gujarati': { recog: 'gu-IN', synth: 'gu' },
        'Bengali': { recog: 'bn-IN', synth: 'bn' }
    };

    // Toggle Speaker State
    speakerToggleBtn.addEventListener('click', () => {
        isSpeakerEnabled = !isSpeakerEnabled;
        if (isSpeakerEnabled) {
            speakerMutedIcon.classList.add('hidden');
            speakerOnIcon.classList.remove('hidden');
        } else {
            speakerOnIcon.classList.add('hidden');
            speakerMutedIcon.classList.remove('hidden');
            window.speechSynthesis.cancel();
        }
    });

    // Speak Text Function
    function speakText(text) {
        window.speechSynthesis.cancel();
        
        // Clean markdown and HTML tags for smooth text-to-speech
        let cleanText = text
            .replace(/\*\*(.*?)\*\*/g, '$1') // Remove bold asterisks
            .replace(/^- /gm, '')            // Remove bullet list dashes
            .replace(/<[^>]*>/g, '');        // Remove HTML tags
            
        const selectedLang = chatLanguageSelect.value;
        const langCode = languageConfig[selectedLang]?.synth || 'en';
        
        const utterance = new SpeechSynthesisUtterance(cleanText);
        
        // Load voices dynamically and attempt to find a matching language voice
        const voices = window.speechSynthesis.getVoices();
        for (let i = 0; i < voices.length; i++) {
            if (voices[i].lang.startsWith(langCode)) {
                utterance.voice = voices[i];
                break;
            }
        }
        
        utterance.lang = langCode;
        utterance.rate = 1.05; // Slightly faster for natural speaking flow
        window.speechSynthesis.speak(utterance);
    }

    // Setup Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onstart = () => {
            isListening = true;
            micOffIcon.classList.add('hidden');
            micRecordingIcon.classList.remove('hidden');
            chatInput.placeholder = "Listening...";
        };
        
        recognition.onend = () => {
            isListening = false;
            micRecordingIcon.classList.add('hidden');
            micOffIcon.classList.remove('hidden');
            chatInput.placeholder = "Type your message...";
        };
        
        recognition.onerror = (event) => {
            console.error("Speech Recognition Error:", event.error);
            isListening = false;
            micRecordingIcon.classList.add('hidden');
            micOffIcon.classList.remove('hidden');
            chatInput.placeholder = "Type your message...";
        };
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            chatInput.value = transcript;
            chatInput.focus();
        };
        
        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                const selectedLang = chatLanguageSelect.value;
                recognition.lang = languageConfig[selectedLang]?.recog || 'en-IN';
                recognition.start();
            }
        });
    } else {
        // Speech Recognition not supported in browser
        micBtn.classList.add('hidden');
        chatInput.classList.remove('pr-20');
        chatInput.classList.add('pr-10');
    }
    
    // Toggle Chat Window
    function toggleChat() {
        if (chatWindow.classList.contains('hidden')) {
            chatWindow.classList.remove('hidden');
            setTimeout(() => {
                chatWindow.classList.remove('scale-95', 'opacity-0');
                chatWindow.classList.add('scale-100', 'opacity-100');
            }, 10);
            iconOpen.classList.add('hidden');
            iconClose.classList.remove('hidden');
            chatInput.focus();
        } else {
            chatWindow.classList.remove('scale-100', 'opacity-100');
            chatWindow.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                chatWindow.classList.add('hidden');
            }, 300);
            iconClose.classList.add('hidden');
            iconOpen.classList.remove('hidden');
            window.speechSynthesis.cancel(); // Stop speaking when closing chat
        }
    }
    
    chatToggleBtn.addEventListener('click', toggleChat);
    closeChatBtn.addEventListener('click', toggleChat);
    
    // Keyboard shortcut (Ctrl+Shift+C)
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'C') {
            e.preventDefault();
            toggleChat();
        }
    });

    // Handle suggestion chips
    document.querySelectorAll('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', function() {
            chatInput.value = this.textContent;
            document.getElementById('chat-suggestions').style.display = 'none';
            chatForm.dispatchEvent(new Event('submit'));
        });
    });
    
    // Add Message to UI
    function appendMessage(text, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex items-center ${isUser ? 'justify-end' : 'justify-start'}`;
        
        const innerDiv = document.createElement('div');
        if (isUser) {
            innerDiv.className = 'bg-blue-600 text-white text-sm py-2 px-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] break-words';
        } else {
            innerDiv.className = 'bg-white border border-gray-100 text-gray-800 text-sm py-2.5 px-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] break-words';
            
            // Add a small speaker play button next to the response
            const speakBtn = document.createElement('button');
            speakBtn.type = 'button';
            speakBtn.className = 'flex items-center justify-center bg-white border border-gray-150 hover:bg-blue-50 text-gray-400 hover:text-blue-600 rounded-full shadow-sm w-7 h-7 ml-2 self-center hover:scale-105 transition-all cursor-pointer flex-shrink-0';
            speakBtn.title = 'Listen to this response';
            speakBtn.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                </svg>
            `;
            speakBtn.addEventListener('click', () => {
                speakText(text);
            });
            msgDiv.appendChild(innerDiv);
            msgDiv.appendChild(speakBtn);
        }
        
        // Handle basic formatting like bold, lists, and newlines
        let formattedText = text;
        formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formattedText = formattedText.replace(/^- (.*)$/gm, '<li>$1</li>');
        formattedText = formattedText.replace(/(<li>.*<\/li>)/s, '<ul class="list-disc pl-4 space-y-1 my-1">$1</ul>');
        formattedText = formattedText.replace(/\n/g, '<br>');
        
        innerDiv.innerHTML = formattedText;
        
        if (isUser) {
            msgDiv.appendChild(innerDiv);
        }
        
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // Show Loading Indicator
    function showLoading() {
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'chat-loading';
        loadingDiv.className = 'flex justify-start';
        loadingDiv.innerHTML = `
            <div class="bg-white border border-gray-100 py-3 px-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
            </div>
        `;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // Remove Loading Indicator
    function hideLoading() {
        const loading = document.getElementById('chat-loading');
        if (loading) loading.remove();
    }
    
    // Handle Form Submit
    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const message = chatInput.value.trim();
        if (!message) return;
        
        // Clear input and disable
        chatInput.value = '';
        chatInput.disabled = true;
        sendBtn.disabled = true;
        
        // Show user message
        appendMessage(message, true);
        showLoading();
        
        const selectedLanguage = chatLanguageSelect.value;
        
        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || ''
                },
                body: JSON.stringify({ 
                    message: message,
                    language: selectedLanguage 
                })
            });
            
            const data = await response.json();
            hideLoading();
            
            if (response.ok && data.reply) {
                appendMessage(data.reply, false);
                if (isSpeakerEnabled) {
                    speakText(data.reply);
                }
            } else {
                appendMessage(data.error || "Sorry, I couldn't process that request.", false);
            }
            
        } catch (error) {
            hideLoading();
            appendMessage("Connection error. Please try again.", false);
        } finally {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }
    });
    
    // Helper to get CSRF cookie if needed
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
</script>
