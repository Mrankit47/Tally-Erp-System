<!-- Floating Chat Widget -->
<div id="chatbot-widget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
    
    <!-- Chat Window (Hidden by default) -->
    <div id="chat-window" class="hidden w-80 sm:w-96 bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-gray-100 transition-all duration-300 transform scale-95 opacity-0 origin-bottom-right mb-4" style="height: 500px; max-height: 80vh;">
        
        <!-- Header -->
        <div class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h3 class="font-bold text-sm">ERP Assistant</h3>
                    <p class="text-blue-200 text-[10px]">Powered by Groq</p>
                </div>
            </div>
            <button id="close-chat-btn" class="text-blue-200 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-3 space-y-2">
            <!-- Initial Greeting -->
            <div class="flex justify-start">
                <div class="bg-white border border-gray-100 text-gray-800 text-sm py-2 px-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                    Hello! I'm your ERP assistant powered by Groq. How can I help you with accounting, GST, or invoices today?
                </div>
            </div>
            
            <!-- Quick Suggestions -->
            <div class="flex flex-wrap gap-2 mt-2" id="chat-suggestions">
                <button type="button" class="suggestion-chip bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100 transition-colors">My total sales?</button>
                <button type="button" class="suggestion-chip bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100 transition-colors">Show recent invoices</button>
                <button type="button" class="suggestion-chip bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100 transition-colors">What is my profit?</button>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-gray-100">
            <form id="chat-form" class="flex items-center gap-2 relative">
                <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" class="flex-1 bg-gray-50 border border-gray-200 text-sm rounded-full py-2.5 pl-4 pr-10 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                <button type="submit" id="send-btn" class="absolute right-2 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>
    
    <!-- Floating Button -->
    <button id="chat-toggle-btn" class="w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg hover:shadow-xl hover:bg-blue-700 transition-all flex items-center justify-center hover:-translate-y-1">
        <svg id="chat-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <svg id="chat-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatToggleBtn = document.getElementById('chat-toggle-btn');
    const closeChatBtn = document.getElementById('close-chat-btn');
    const chatWindow = document.getElementById('chat-window');
    const iconOpen = document.getElementById('chat-icon-open');
    const iconClose = document.getElementById('chat-icon-close');
    
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    const sendBtn = document.getElementById('send-btn');
    
    // Toggle Chat Window
    function toggleChat() {
        if (chatWindow.classList.contains('hidden')) {
            chatWindow.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity/transform
            setTimeout(() => {
                chatWindow.classList.remove('scale-95', 'opacity-0');
                chatWindow.classList.add('scale-100', 'opacity-100');
            }, 10);
            iconOpen.classList.add('hidden');
            iconClose.classList.remove('hidden');
            chatInput.focus();
        } else {
            chatWindow.classList.remove('scale-100', 'opacity-100');
            chatWindow.classList.add('scale-95', 'opacity-0');
            // Wait for animation to finish before hiding
            setTimeout(() => {
                chatWindow.classList.add('hidden');
            }, 300);
            iconClose.classList.add('hidden');
            iconOpen.classList.remove('hidden');
        }
    }
    
    chatToggleBtn.addEventListener('click', toggleChat);
    closeChatBtn.addEventListener('click', toggleChat);
    
    // Keyboard shortcut (Ctrl+Shift+C)
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'C') {
            e.preventDefault();
            toggleChat();
        }
    });

    // Handle suggestion chips
    document.querySelectorAll('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', function() {
            chatInput.value = this.textContent;
            // Hide suggestions after clicking one
            document.getElementById('chat-suggestions').style.display = 'none';
            // Trigger submit
            chatForm.dispatchEvent(new Event('submit'));
        });
    });
    
    // Add Message to UI
    function appendMessage(text, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
        
        const innerDiv = document.createElement('div');
        if (isUser) {
            innerDiv.className = 'bg-blue-600 text-white text-sm py-2 px-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] break-words';
        } else {
            innerDiv.className = 'bg-white border border-gray-100 text-gray-800 text-sm py-2 px-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] break-words';
        }
        
        // Handle basic formatting like bold, lists, and newlines
        let formattedText = text;
        // Bolding
        formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // Lists
        formattedText = formattedText.replace(/^- (.*)$/gm, '<li>$1</li>');
        formattedText = formattedText.replace(/(<li>.*<\/li>)/s, '<ul class="list-disc pl-4 space-y-1 my-1">$1</ul>');
        // Newlines
        formattedText = formattedText.replace(/\n/g, '<br>');
        
        innerDiv.innerHTML = formattedText;
        
        msgDiv.appendChild(innerDiv);
        chatMessages.appendChild(msgDiv);
        
        // Scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // Show Loading Indicator
    function showLoading() {
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'chat-loading';
        loadingDiv.className = 'flex justify-start';
        loadingDiv.innerHTML = `
            <div class="bg-white border border-gray-100 py-3 px-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
            </div>
        `;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // Remove Loading Indicator
    function hideLoading() {
        const loading = document.getElementById('chat-loading');
        if (loading) loading.remove();
    }
    
    // Handle Form Submit
    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const message = chatInput.value.trim();
        if (!message) return;
        
        // Clear input and disable
        chatInput.value = '';
        chatInput.disabled = true;
        sendBtn.disabled = true;
        
        // Show user message
        appendMessage(message, true);
        showLoading();
        
        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || ''
                },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            hideLoading();
            
            if (response.ok && data.reply) {
                appendMessage(data.reply, false);
            } else {
                appendMessage(data.error || "Sorry, I couldn't process that request.", false);
            }
            
        } catch (error) {
            hideLoading();
            appendMessage("Connection error. Please try again.", false);
        } finally {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }
    });
    
    // Helper to get CSRF cookie if needed
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
</script>
