# ==============================================================================
# Render Blueprint — Django ERP
# ==============================================================================
# This file enables one-click deploys from the Render Dashboard.
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: django-erp
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.11"

databases:
  - name: erp-db
    plan: free
    databaseName: erp_db
    user: erp_user
